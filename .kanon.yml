thresholds: {dep_count_warn: 1000, dep_count_error: 1500}
# WHY(YAML/missing-concurrency on gate-attestation.yml): the rule detects a push/pull_request
# workflow with no `concurrency:` block and prescribes adding one. That prescription is wrong
# for this file: gate-attestation.yml is a thin caller that delegates to
# `forkwright/.github/.github/workflows/hybrid-gate.yml`, and the callee already declares
# `concurrency: group: ${{ github.workflow }}-${{ github.ref }}` and documents that callers
# must NOT also set a group with that key. The rule's own rationale — stacked runs wasting
# compute — is therefore already satisfied by the callee. The check has no `uses:` resolution,
# so it cannot see the delegation and fires on every hybrid-gate caller.
# WARNING: this is the ONLY lint violation on theatron's main, and `kanon gate` requires ZERO
# violations under strict_warnings. Without this entry no theatron branch can ever be stamped,
# which makes every branch and every bot PR in this repo permanently unmergeable.
suppress: [{rule: MANIFEST/dep-count, files: [Cargo.lock]}, {rule: RUST/indexing-slicing, files: [crates/dokimasia/src/css.rs]}, {rule: RUST/indexing-slicing, files: [crates/bathron/src/notifications.rs]}, {rule: ARCHITECTURE/trait-impl-colocation, files: [crates/parodos/src/env.rs]}, {rule: YAML/missing-concurrency, files: [.github/workflows/gate-attestation.yml]}]
